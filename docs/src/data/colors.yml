# The v6 palette: the five chromatic theme colours, overriding the engine's
# Bootstrap-shaped list. Values mirror `$colors` in scss/_colors.scss.
- name: primary
  hex: "oklch(52.945% 0.19103 278.34)"
- name: success
  hex: "oklch(55.1% 0.173 145)"
- name: info
  hex: "oklch(57.4% 0.196 256)"
- name: warning
  hex: "oklch(84% 0.172 85)"
- name: danger
  hex: "oklch(58.7% 0.237 23.81)"
