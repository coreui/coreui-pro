name: Visual

on:
  push:
    branches: [main, v6-dev, feat/v6-config]
  pull_request:
    branches: [main, v6-dev, feat/v6-config]
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE: 22

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE }}"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Baselines are per platform. Until the Linux set is committed (from the
      # artifact of a bootstrap run), the job generates it instead of failing.
      - name: Check for Linux baselines
        id: baselines
        run: |
          if ls js/tests/visual/__screenshots__/*/*-chromium-linux.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual tests
        if: steps.baselines.outputs.present == 'true'
        run: npm run js-test-visual

      - name: Bootstrap Linux baselines
        if: steps.baselines.outputs.present == 'false'
        run: |
          npm run js-test-visual -- --update
          echo "::notice::No Linux baselines yet — generated a set. Download the artifact and commit it to enable the gate."

      # `.vitest-attachments/` is where the actual and diff images land. Without
      # it a failing run hands back the stale baseline and nothing to compare it
      # against; with it the actual image is also the replacement baseline when
      # the change was intended.
      - name: Upload baselines or diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          # `.vitest-attachments/` is a dot directory, and upload-artifact skips
          # those unless told otherwise.
          include-hidden-files: true
          path: |
            js/tests/visual/__screenshots__/
            .vitest-attachments/
          retention-days: 14
